<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>✦ 𝑻𝒐𝒅𝒂 𝑳𝒊𝒏𝒅𝒂 𝑴𝒐𝒅𝒂𝒔 ✦</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #fff 0%, #fff5fa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        /* FOTO DE PERFIL */
        .profile-photo {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;

            border-radius: 50%;
            overflow: hidden;

            border: 4px solid #ff1493;
            background: #fff;

            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.25);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* NOME */
        .title {
            font-size: 28px;
            font-weight: 800;
            color: #ff1493;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
        }

        /* BOTÕES */
        .button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 60px;

            margin-bottom: 15px;
            padding: 15px 20px;

            border-radius: 16px;

            text-decoration: none;
            font-size: 17px;
            font-weight: 700;

            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .instagram {
            background: linear-gradient(135deg, #833ab4, hsl(308, 98%, 55%), #f30775);
            color: white;
            box-shadow: 0 7px 18px rgba(225, 48, 108, 0.25);
        }

        .whatsapp {
            background: linear-gradient(135deg, #833ab4, hsl(308, 98%, 55%), #f30775);
            color: white;
            box-shadow: 0 7px 18px rgba(225, 48, 108, 0.25);
        }

        .google {
            background: linear-gradient(135deg, #833ab4, hsl(308, 98%, 55%), #f30775);
            color: white;
            box-shadow: 0 7px 18px rgba(225, 48, 108, 0.25);
        }

        .icon {
            font-size: 25px;
            margin-right: 12px;
        }

        /* RODAPÉ */
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #999;
        }

        /* CELULAR */
        @media (max-width: 400px) {
            .title {
                font-size: 24px;
            }

            .button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!--
            FOTO DE PERFIL

            Para colocar sua foto:

            1. Coloque a imagem na mesma pasta deste index.html
            2. Renomeie para:

               perfil.jpg

            3. O código abaixo já está preparado.
        -->

        <div class="profile-photo">
            <img src="perfil.jpg" alt="Toda Linda Modas">
        </div>


        <!-- NOME DA LOJA -->

        <h1 class="title">
             𝑻𝒐𝒅𝒂 𝑳𝒊𝒏𝒅𝒂 𝑴𝒐𝒅𝒂𝒔 
        </h1>

        <p class="subtitle">
            ✦ 𝐵𝑒𝑙𝑒𝑧𝑎 𝑒 𝑚𝑜𝑑𝑎 𝑒𝑚 𝑠𝑖𝑛𝑡𝑜𝑛𝑖𝑎 ✦
        </p>


        <!-- INSTAGRAM -->

        <a
            class="button instagram"
            href="https://www.instagram.com/___todalindamodas___/"
            target="_blank"
        >
            <span class="icon">📸</span> 
            Instagram
        </a>


        <!-- WHATSAPP -->

        <a
            class="button whatsapp"
            href="https://wa.me/5511958520541?text=Ol%C3%A1%20Toda%20Linda%20Modas!%20Vim%20pelo%20link%20da%20loja."
            target="_blank"
        >
            <span class="icon">💬</span>
            WhatsApp
        </a>


        <!-- GOOGLE -->

        <a
            class="button google"
            href="https://share.google/zEq5XrOg0rGBmznnv"
            target="_blank"
        >
            <span class="icon">⭐</span>
            Avalie nossa loja no Google
        </a>


        <!-- RODAPÉ -->

        <div class="footer">
            © 2026 Toda Linda Modas
        </div>

    </main>

</body>
</html>
